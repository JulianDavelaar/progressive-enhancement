<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Switch control / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
			.switch {
				--width: 80px;
				--height: 40px;
				--padding: 5px;

				appearance: none;
				width:var(--width);
				height: var(--height);
				padding: var(--padding);
				background-color: #9e9d9d;
				border-radius: 1000px;
				position: relative;
				cursor: pointer;
				transition: background-color 0.3s;
			}

			.switch::before {
				display: grid;
				place-items: center;
				content: "uit";
				width: calc(var(--height) - var(--padding) * 2);
				height: calc(var(--height) - var(--padding) * 2);
				background: white;
				border-radius: 50%;
				/* position: absolute; */
				/* top: 3px;
				left: 3px;	 */
				transition: 3s;
			}

			.switch:checked {
				background-color: #64e475;
			}

			.switch:checked::before {
				translate: calc(var(--width) - var(--padding) * 2 - (var(--height) - 2 * var(--padding)));
				content: "aan";
				/* display: flex;
				align-items: center;
				place-content: center; */
				font-weight:600;	
				rotate: 8turn;

			}


			/* Schrijf hier gewoon je CSS voor dit component */

			/* Hint: Dit component kun je volledig met HTML en CSS bouwen */

			/* Hint: Hoe ver ga je qua styling? Vraag jezelf dit altijd af */
		</style>
	</head>
	<body>

		<h1>Switch control</h1>
			<input type="checkbox" class="switch">

		<!-- Hint: Safari heeft hiervoor iets bedacht, maar is dat al een standaard?
		     Wat gebeurt er in browsers die dat nog niet ondersteunen? -->

		<details open>
			<summary>Demo video</summary>
			<video src="assets/switch.mp4" width="119" height="67" controls muted autoplay loop>
				<a href="assets/switch.mp4">assets/switch.mp4</a>
			</video>
		</details>
	</body>
</html>
